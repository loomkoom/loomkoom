name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=loomkoom&langs_count=14&layout=compact&theme=gruvbox&bg_color=00000000&hide=blade,html,css,scss,json,markdown,yaml&size_weight=0.17&count_weight=0.83
          path: profile/top-langs.svg
          token: ${{ secrets.PAT }} # classic PAT with repo + read:user, so private repos count

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          git diff --cached --quiet || git commit -m "Update README cards"
          git push
